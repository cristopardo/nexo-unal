[project]
name = "nexo-unal"
version = "0.1.0"
description = "Asistente universitario con fuentes oficiales, WhatsApp y métricas agregadas."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "google-auth>=2.38,<3",
  "google-cloud-firestore>=2.20,<3",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
